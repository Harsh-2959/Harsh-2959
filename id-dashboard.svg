<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      * { box-sizing: border-box; }
      .font-sans { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', monospace; }
      @keyframes pendulum-swing {
        0% { transform: rotate(0deg); }
        20% { transform: rotate(3.2deg); }
        40% { transform: rotate(-2.8deg); }
        60% { transform: rotate(1.8deg); }
        80% { transform: rotate(-1deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes holo-sweep {
        0% { transform: translateX(-180px) rotate(25deg); opacity: 0; }
        30% { opacity: 0.35; }
        60% { opacity: 0.35; }
        100% { transform: translateX(360px) rotate(25deg); opacity: 0; }
      }
      @keyframes live-radar {
        0% { transform: scale(1); opacity: 0.9; }
        100% { transform: scale(2.6); opacity: 0; }
      }
      .pendulum-group { animation: pendulum-swing 7s ease-in-out infinite; transform-origin: 190px 0; }
      .holo-beam { animation: holo-sweep 5s ease-in-out infinite; }
      .radar-pulse { animation: live-radar 2s ease-out infinite; transform-origin: center; }
    </style>

    <linearGradient id="holo-foil" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#E8E0D2" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#7F95FF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="chip-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#112454" />
      <stop offset="100%" stop-color="#07122E" />
    </linearGradient>

    <linearGradient id="dash-trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7F95FF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="bar-blue-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0.55)" />
    </linearGradient>

    <linearGradient id="bar-sapphire-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F95FF" />
      <stop offset="100%" stop-color="rgba(127, 149, 255, 0.55)" />
    </linearGradient>

    <linearGradient id="bar-ivory-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8E0D2" />
      <stop offset="100%" stop-color="rgba(232, 224, 210, 0.55)" />
    </linearGradient>

    <pattern id="dash-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(56, 189, 248, 0.04)" stroke-width="1"/>
    </pattern>

    <clipPath id="badge-clip">
      <rect x="0" y="0" width="260" height="300" rx="14" />
    </clipPath>
  </defs>

  <!-- Deep Ink Navy Card Base -->
  <rect x="2" y="2" width="896" height="406" rx="20" fill="#02040F" stroke="#112454" stroke-width="1.2" />
  <rect x="2" y="2" width="896" height="406" rx="20" fill="url(#dash-grid)" />

  <!-- Animated Perimeter Trace Beam -->
  <rect x="2" y="2" width="896" height="406" rx="20" fill="none"
        stroke="url(#dash-trace)" stroke-width="2.2"
        stroke-dasharray="480 2140" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="2620;0" dur="12s" repeatCount="indefinite" />
  </rect>

  <!-- Lanyard Badge -->
  <g class="pendulum-group">
    <!-- Lanyard Strap & Clip -->
    <g transform="translate(162, 0)">
      <path d="M 12 0 L 20 48 L 36 48 L 44 0 Z" fill="#07122E" stroke="#112454" stroke-width="1" />
      <text x="28" y="26" class="font-mono" font-size="7" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="0.5">DEV</text>
      <text x="28" y="38" class="font-mono" font-size="6" font-weight="600" fill="#E8E0D2" text-anchor="middle">PASS</text>
      <circle cx="28" cy="52" r="8" fill="none" stroke="#38BDF8" stroke-width="2" />
      <rect x="23" y="56" width="10" height="14" rx="2" fill="#07122E" stroke="#112454" stroke-width="1" />
      <polygon points="21,70 35,70 32,77 24,77" fill="#38BDF8" />
    </g>

    <!-- Floating ID Card -->
    <g transform="translate(60, 78)">
      <rect x="4" y="4" width="260" height="300" rx="14" fill="#000000" fill-opacity="0.45" />
      <rect x="0" y="0" width="260" height="300" rx="14" fill="#07122E" stroke="#112454" stroke-width="1.2" />

      <!-- Holographic Foil Sheen -->
      <g clip-path="url(#badge-clip)">
        <rect x="-80" y="-40" width="100" height="380" fill="url(#holo-foil)" class="holo-beam" />
      </g>

      <!-- Badge Slot & Header -->
      <rect x="105" y="10" width="50" height="7" rx="3.5" fill="#02040F" stroke="#112454" stroke-width="0.8" />
      <text x="130" y="36" class="font-mono" font-size="8.5" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="1">ENGINEERING ACCESS</text>
      <text x="130" y="48" class="font-sans" font-size="7.5" font-weight="600" fill="rgba(232, 224, 210, 0.6)" text-anchor="middle">VIVA INSTITUTE OF TECHNOLOGY</text>

      <!-- User Avatar Placeholder -->
      <g transform="translate(20, 60)">
        <rect x="0" y="0" width="70" height="82" rx="8" fill="#02040F" stroke="#112454" stroke-width="1" />
        <circle cx="35" cy="32" r="16" fill="#07122E" stroke="#38BDF8" stroke-width="1" />
        <circle cx="35" cy="28" r="8" fill="#E8E0D2" />
        <path d="M 23 44 Q 35 38 47 44" fill="none" stroke="#E8E0D2" stroke-width="2" />
        <rect x="4" y="66" width="62" height="12" rx="3" fill="#07122E" stroke="#112454" stroke-width="0.8" />
        <text x="35" y="75" class="font-mono" font-size="7" font-weight="700" fill="#38BDF8" text-anchor="middle">VERIFIED</text>
      </g>

      <!-- Identity Details -->
      <g transform="translate(100, 72)">
        <text x="0" y="0" class="font-mono" font-size="7" font-weight="600" fill="rgba(232, 224, 210, 0.6)">NAME</text>
        <text x="0" y="16" class="font-sans" font-size="13" font-weight="800" fill="#E8E0D2">Harsh Patil</text>
        <text x="0" y="32" class="font-mono" font-size="8" font-weight="700" fill="#38BDF8">ID: HP-2025-DEV</text>
        <circle cx="4" cy="46" r="3" fill="#38BDF8" />
        <text x="12" y="49" class="font-sans" font-size="8.5" font-weight="600" fill="rgba(232, 224, 210, 0.8)">Active Engineer</text>
      </g>

      <!-- Cyber Security Chip -->
      <g transform="translate(20, 156)">
        <rect x="0" y="0" width="36" height="26" rx="4" fill="url(#chip-grad)" stroke="#38BDF8" stroke-width="1" />
        <line x1="18" y1="0" x2="18" y2="26" stroke="#38BDF8" stroke-width="0.8" />
        <line x1="0" y1="13" x2="36" y2="13" stroke="#38BDF8" stroke-width="0.8" />
        <rect x="11" y="7" width="14" height="12" rx="2" fill="none" stroke="#E8E0D2" stroke-width="0.8" />
      </g>

      <!-- Secure Token Pill -->
      <g transform="translate(68, 156)">
        <rect x="0" y="0" width="172" height="26" rx="6" fill="#02040F" stroke="#112454" stroke-width="1" />
        <g transform="translate(14, 13)">
          <path d="M 0 -6 L 5.5 -3 L 5.5 1 C 5.5 4.5 0 7.5 0 7.5 C 0 7.5 -5.5 4.5 -5.5 1 L -5.5 -3 Z" fill="#07122E" stroke="#38BDF8" stroke-width="1" />
          <path d="M -2 0 L -0.5 1.5 L 2.5 -1.5" fill="none" stroke="#E8E0D2" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" />
        </g>
        <text x="28" y="17" class="font-mono" font-size="8" font-weight="700" fill="#E8E0D2">SECURE PASS · AUTH: OK</text>
      </g>

      <!-- Academic Stream -->
      <g transform="translate(20, 196)">
        <text x="0" y="0" class="font-mono" font-size="7.5" font-weight="600" fill="rgba(232, 224, 210, 0.6)">PROGRAM</text>
        <text x="0" y="14" class="font-sans" font-size="10.5" font-weight="700" fill="#E8E0D2">B.E. Computer Engineering</text>
        <text x="0" y="27" class="font-mono" font-size="8" fill="#38BDF8">Expected Graduation: 2029</text>
      </g>

      <!-- Barcode -->
      <g transform="translate(20, 242)">
        <line x1="0" y1="0" x2="220" y2="0" stroke="#112454" stroke-width="0.8" />
        <g transform="translate(0, 10)">
          <line x1="2" y1="0" x2="2" y2="22" stroke="#E8E0D2" stroke-width="2" />
          <line x1="7" y1="0" x2="7" y2="22" stroke="#E8E0D2" stroke-width="1" />
          <line x1="11" y1="0" x2="11" y2="22" stroke="#38BDF8" stroke-width="3" />
          <line x1="17" y1="0" x2="17" y2="22" stroke="#E8E0D2" stroke-width="1.5" />
          <line x1="22" y1="0" x2="22" y2="22" stroke="#E8E0D2" stroke-width="2" />
          <line x1="28" y1="0" x2="28" y2="22" stroke="#38BDF8" stroke-width="1" />
          <line x1="33" y1="0" x2="33" y2="22" stroke="#E8E0D2" stroke-width="2.5" />
          <line x1="38" y1="0" x2="38" y2="22" stroke="#E8E0D2" stroke-width="1" />
          <line x1="43" y1="0" x2="43" y2="22" stroke="#38BDF8" stroke-width="3" />
          <line x1="50" y1="0" x2="50" y2="22" stroke="#E8E0D2" stroke-width="1.5" />
          <line x1="56" y1="0" x2="56" y2="22" stroke="#E8E0D2" stroke-width="2" />
          <line x1="62" y1="0" x2="62" y2="22" stroke="#38BDF8" stroke-width="1" />
          <line x1="68" y1="0" x2="68" y2="22" stroke="#E8E0D2" stroke-width="2.5" />
          <line x1="74" y1="0" x2="74" y2="22" stroke="#E8E0D2" stroke-width="1.5" />
          <line x1="80" y1="0" x2="80" y2="22" stroke="#38BDF8" stroke-width="3" />
        </g>
        <text x="220" y="24" class="font-mono" font-size="8" font-weight="600" fill="rgba(232, 224, 210, 0.6)" text-anchor="end">KEY: #7394-DEV</text>
      </g>
    </g>
  </g>

  <!-- Right Dashboard -->
  <g transform="translate(360, 28)">
    <text x="0" y="0" class="font-mono" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="1.5">// VERIFIED CREDENTIALS &amp; CAPABILITY</text>
    <text x="0" y="22" class="font-sans" font-size="19" font-weight="800" fill="#E8E0D2" letter-spacing="-0.3">Academic &amp; Engineering Metrics</text>

    <!-- KPI Tiles -->
    <g transform="translate(0, 42)">
      <!-- Tile 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="246" height="82" rx="12" fill="#07122E" stroke="#112454" stroke-width="1" />
        <rect x="0" y="0" width="4" height="82" rx="2" fill="#38BDF8" />
        <text x="16" y="22" class="font-mono" font-size="9" font-weight="700" fill="#38BDF8" letter-spacing="1">CURRENT STATUS</text>
        <text x="16" y="48" class="font-sans" font-size="22" font-weight="800" fill="#E8E0D2">B.E. Comp Eng</text>
        <text x="160" y="48" class="font-mono" font-size="11" font-weight="700" fill="#38BDF8">Exp 2029</text>
        <text x="16" y="68" class="font-sans" font-size="10.5" font-weight="500" fill="rgba(232, 224, 210, 0.7)">Viva Institute of Technology</text>
      </g>

      <!-- Tile 2 -->
      <g transform="translate(258, 0)">
        <rect x="0" y="0" width="246" height="82" rx="12" fill="#07122E" stroke="#112454" stroke-width="1" />
        <rect x="0" y="0" width="4" height="82" rx="2" fill="#7F95FF" />
        <text x="16" y="22" class="font-mono" font-size="9" font-weight="700" fill="#7F95FF" letter-spacing="1">PREVIOUS MERIT</text>
        <text x="16" y="48" class="font-sans" font-size="24" font-weight="800" fill="#E8E0D2">82.29%</text>
        <text x="120" y="48" class="font-mono" font-size="10" font-weight="700" fill="#7F95FF">DISTINCTION</text>
        <text x="16" y="68" class="font-sans" font-size="10.5" font-weight="500" fill="rgba(232, 224, 210, 0.7)">Diploma in Computer Engineering</text>
      </g>
    </g>

    <!-- Velocity Bar Chart -->
    <g transform="translate(0, 140)">
      <rect x="0" y="0" width="504" height="130" rx="12" fill="#07122E" stroke="#112454" stroke-width="1" />
      <text x="16" y="22" class="font-mono" font-size="10" font-weight="700" fill="#38BDF8" letter-spacing="1">ENGINEERING VELOCITY &amp; READINESS</text>

      <g transform="translate(16, 36)">
        <text x="0" y="10" class="font-sans" font-size="10.5" font-weight="600" fill="#E8E0D2">Interfaces &amp; Systems Craft</text>
        <text x="472" y="10" class="font-mono" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="end">94%</text>
        <rect x="0" y="14" width="472" height="6" rx="3" fill="#02040F" />
        <rect x="0" y="14" width="443" height="6" rx="3" fill="url(#bar-blue-grad)" />
      </g>

      <g transform="translate(16, 62)">
        <text x="0" y="10" class="font-sans" font-size="10.5" font-weight="600" fill="#E8E0D2">AI &amp; Intelligent Architecture</text>
        <text x="472" y="10" class="font-mono" font-size="10" font-weight="700" fill="#7F95FF" text-anchor="end">88%</text>
        <rect x="0" y="14" width="472" height="6" rx="3" fill="#02040F" />
        <rect x="0" y="14" width="415" height="6" rx="3" fill="url(#bar-sapphire-grad)" />
      </g>

      <g transform="translate(16, 88)">
        <text x="0" y="10" class="font-sans" font-size="10.5" font-weight="600" fill="#E8E0D2">Cybersecurity, Recon &amp; Linux</text>
        <text x="472" y="10" class="font-mono" font-size="10" font-weight="700" fill="#E8E0D2" text-anchor="end">85%</text>
        <rect x="0" y="14" width="472" height="6" rx="3" fill="#02040F" />
        <rect x="0" y="14" width="401" height="6" rx="3" fill="url(#bar-ivory-grad)" />
      </g>
    </g>

    <!-- Radar / Now Scan Box -->
    <g transform="translate(0, 286)">
      <rect x="0" y="0" width="504" height="66" rx="12" fill="#07122E" stroke="#112454" stroke-width="1" />
      <g transform="translate(24, 33)">
        <circle cx="0" cy="0" r="10" fill="#38BDF8" fill-opacity="0.3" class="radar-pulse" />
        <circle cx="0" cy="0" r="5" fill="#38BDF8" />
      </g>
      <g transform="translate(46, 22)">
        <text x="0" y="0" class="font-mono" font-size="9" font-weight="700" fill="#38BDF8" letter-spacing="1">CURRENT DISCOVERY TRACK</text>
        <text x="0" y="20" class="font-mono" font-size="11.5" font-weight="800" fill="#E8E0D2" letter-spacing="0.5">
          EXPLORING AI · FULL-STACK CRAFT · CYBERSECURITY
        </text>
      </g>
    </g>
  </g>
</svg>
